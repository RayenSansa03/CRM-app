  <body class="mat-typography">
    <app-root></app-root>

    <!-- Ajout de la carte Google Maps -->
    <div id="map" style="height: 400px; width: 100%;"></div>

    <script>
      function initMap() {
        const map = new google.maps.Map(document.getElementById('map'), {
          center: { lat: 48.8566, lng: 2.3522 }, // Paris par défaut
          zoom: 13
        });

        const directionsService = new google.maps.DirectionsService();
        const directionsRenderer = new google.maps.DirectionsRenderer();
        directionsRenderer.setMap(map);

        const autocompleteDepart = new google.maps.places.Autocomplete(document.getElementById('lieuDepartInput'));
        const autocompleteDestination = new google.maps.places.Autocomplete(document.getElementById('destinationInput'));

        // Lorsque le lieu change, calculer et afficher l'itinéraire
        autocompleteDepart.addListener('place_changed', () => calculateAndDisplayRoute(directionsService, directionsRenderer, autocompleteDepart, autocompleteDestination));
        autocompleteDestination.addListener('place_changed', () => calculateAndDisplayRoute(directionsService, directionsRenderer, autocompleteDepart, autocompleteDestination));
      }

      function calculateAndDisplayRoute(directionsService, directionsRenderer, autocompleteDepart, autocompleteDestination) {
        const placeDepart = autocompleteDepart.getPlace();
        const placeDestination = autocompleteDestination.getPlace();

        if (placeDepart && placeDepart.geometry && placeDestination && placeDestination.geometry) {
          directionsService.route({
            origin: placeDepart.geometry.location,
            destination: placeDestination.geometry.location,
            travelMode: google.maps.TravelMode.DRIVING
          }, (response, status) => {
            if (status === google.maps.DirectionsStatus.OK) {
              directionsRenderer.setDirections(response);
            } else {
              console.error('Erreur lors du calcul de l\'itinéraire : ', status);
            }
          });
        }
      }

      window.initMap = initMap;
    </script>
