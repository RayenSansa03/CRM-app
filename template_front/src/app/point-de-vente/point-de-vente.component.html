<!-- Layout wrapper -->
<div class="layout-wrapper layout-content-navbar">
  <div class="layout-container">
    <!-- Sidebar -->
    <app-expbar2></app-expbar2>

    <!-- Layout container -->
    <div class="layout-page">
      <!-- Navbar -->
      <app-expbar></app-expbar>

      <!-- Content wrapper -->
      <div class="content-wrapper">
        <!-- Main Content -->
        <div class="container-xxl flex-grow-1 container-p-y">
          <div class="row">
            <!-- Bouton pour connecter avec Cronofy -->
            <div class="col-12 text-center" *ngIf="!accessToken">
              <button (click)="loginWithCronofy()" class="btn btn-primary btn-lg">
                Connecter avec Cronofy
              </button>
            </div>

            <!-- Affichage du calendrier si connecté -->
            <div class="col-12 mt-4" *ngIf="accessToken">
              <h3 class="text-center">Calendrier Cronofy</h3>
              <div class="card">
                <div class="card-body">
                  <full-calendar #calendar [options]="calendarOptions"></full-calendar>

                  <!-- Bouton pour rafraîchir les événements -->
                  <div class="text-center mt-4">
                    <button (click)="refreshEvents()" class="btn btn-secondary">
                      Rafraîchir les événements
                    </button>
                  </div>

                  <!-- Message si aucun événement n'est trouvé -->
                  <div *ngIf="events.length === 0" class="text-center mt-4">
                    <p>Aucun événement trouvé.</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- /Main Content -->

        <!-- Footer -->
        <footer class="content-footer footer bg-footer-theme">
          <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
            <div class="mb-2 mb-md-0">
              ©
              <script>
                document.write(new Date().getFullYear());
              </script>
              , made with ❤️ by
              <a href="https://themeselection.com" target="_blank" class="footer-link fw-bolder">ThemeSelection</a>
            </div>
            <div>
              <a href="https://themeselection.com/license/" class="footer-link me-4" target="_blank">License</a>
              <a href="https://themeselection.com/" target="_blank" class="footer-link me-4">More Themes</a>
              <a href="https://themeselection.com/demo/sneat-bootstrap-html-admin-template/documentation/" target="_blank" class="footer-link me-4">Documentation</a>
              <a href="https://github.com/themeselection/sneat-html-admin-template-free/issues" target="_blank" class="footer-link me-4">Support</a>
            </div>
          </div>
        </footer>
        <!-- /Footer -->

        <div class="content-backdrop fade"></div>
      </div>
      <!-- /Content wrapper -->
    </div>
    <!-- /Layout page -->
  </div>

  <!-- Overlay -->
  <div class="layout-overlay layout-menu-toggle"></div>
</div>
<!-- /Layout wrapper -->

<div class="buy-now">
  <a href="https://themeselection.com/products/sneat-bootstrap-html-admin-template/" target="_blank" class="btn btn-danger btn-buy-now">Contactez-nous</a>
</div>
