<html lang="en">
  <head>
    <!-- tes autres liens et métadonnées -->
  </head>
  <body>
    <div class="layout-wrapper layout-content-navbar">
      <div class="layout-container">
        <app-expbar2></app-expbar2>
        <div class="layout-page">
          <app-expbar></app-expbar>
          <div class="content-wrapper">
            <div class="container-xxl flex-grow-1 container-p-y">
              <div class="row">
                <p-steps [model]="items" [(activeIndex)]="activeIndex"></p-steps>
                <form [formGroup]="equipmentForm" (ngSubmit)="onSubmit()">
                  <!-- Étape 1: Détails de l'équipement -->
                  <div *ngIf="activeIndex === 0" class="card">
                    <div class="p-fluid grid">
                      <div class="field col-6">
                        <label for="designation">Désignation:</label>
                        <input
                          pInputText
                          type="text"
                          id="designation"
                          formControlName="designation"
                          required
                        />
                      </div>
                      <div class="field col-6">
                        <label for="cout">Coût:</label>
                        <input
                          pInputText
                          type="number"
                          id="cout"
                          formControlName="cout"
                          required
                        />
                      </div>
                      <div class="field col-6">
                        <label for="categorie">Catégorie:</label>
                        <input
                          pInputText
                          type="text"
                          id="categorie"
                          formControlName="categorie"
                          required
                        />
                      </div>
                      <div class="field col-12">
                        <label for="description">Description:</label>
                        <textarea
                          pInputTextarea
                          id="description"
                          formControlName="description"
                          rows="3"
                          required
                        ></textarea>
                      </div>
                      <div class="field col-6">
                        <label for="etat">État:</label>
                        <p-dropdown
                          [options]="etats"
                          formControlName="etat"
                          placeholder="Sélectionner un état"
                          required
                        ></p-dropdown>
                      </div>
                      <div class="field col-6">
                        <label for="prixParJour">Prix Par Jour:</label>
                        <input
                          pInputText
                          type="number"
                          id="prixParJour"
                          formControlName="prixParJour"
                          required
                        />
                      </div>
                    </div>
                  </div>

                  <!-- Étape 2 et suivantes peuvent être ajoutées ici -->
                  <div *ngIf="activeIndex === 1" class="card">
                    <!-- Contenu pour l'étape 2 -->
                  </div>

                  <div class="p-d-flex p-jc-between p-mt-3">
                    <button pButton type="button" (click)="previousStep()" label="Précédent" icon="pi pi-arrow-left" *ngIf="activeIndex > 0"></button>
                    <button pButton type="button" (click)="nextStep()" label="Suivant" icon="pi pi-arrow-right" iconPos="right" *ngIf="activeIndex < items.length - 1"></button>
                    <button pButton type="submit" label="Ajouter l'équipement" icon="pi pi-check" *ngIf="activeIndex === items.length - 1"></button>
                  </div>
                </form>
              </div>
            </div>
            <footer class="content-footer footer bg-footer-theme">
              <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
                <div class="mb-2 mb-md-0">
                  © <script>document.write(new Date().getFullYear());</script>, made with ❤️ by
                  <a href="https://themeselection.com" target="_blank" class="footer-link fw-bolder">ThemeSelection</a>
                </div>
                <div>
                  <a href="https://themeselection.com/license/" class="footer-link me-4" target="_blank">License</a>
                  <a href="https://themeselection.com/" target="_blank" class="footer-link me-4">More Themes</a>
                  <a href="https://themeselection.com/demo/sneat-bootstrap-html-admin-template/documentation/" target="_blank" class="footer-link me-4">Documentation</a>
                  <a href="https://github.com/themeselection/sneat-html-admin-template-free/issues" target="_blank" class="footer-link me-4">Support</a>
                </div>
              </div>
            </footer>
            <div class="content-backdrop fade"></div>
          </div>
        </div>
        <div class="layout-overlay layout-menu-toggle"></div>
      </div>
    </div>
    <div class="buy-now">
      <a href="https://themeselection.com/products/sneat-bootstrap-html-admin-template/" target="_blank" class="btn btn-danger btn-buy-now">Contactez-nous</a>
    </div>
  </body>
</html>
