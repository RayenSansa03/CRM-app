<!DOCTYPE html>
<html lang="en">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com"/>
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/images/apple-touch-icon.png"/>
<link rel="shortcut icon" href="../../assets/images/favicon.png"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<meta charSet="utf-8"/>
<title>Materio - Material Design React Admin Template</title>
<meta name="description" content="Materio – Material Design React Admin Dashboard Template – is the most developer friendly &amp; highly customizable Admin Dashboard Template based on MUI v5."/>
<meta name="keywords" content="Material Design, MUI, Admin Template, React Admin Template"/>
<meta name="viewport" content="initial-scale=1, width=device-width"/>
<meta name="next-head-count" content="5"/>
<link rel="preload" href="/_next/static/css/6d5ec1825ef0b9a5.css" as="style"/>
<link rel="stylesheet" href="/_next/static/css/6d5ec1825ef0b9a5.css" data-n-g=""/>

<style>
  #map {
    height: 400px;
    width: 100%;
  }
  .form-container {
    max-width: 600px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f9f9f9;
  }
  .form-container input, .form-container select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
    font-size: 16px;
  }
</style>

</head>
<body>
  <!-- Layout wrapper -->
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

      <app-expbar2></app-expbar2>
      <!-- / Menu -->

      <!-- Layout container -->
      <div class="layout-page">
        <!-- Navbar -->

        <app-expbar></app-expbar>
        <div class="content-wrapper">
          <!-- Content -->

          <div class="container-xxl flex-grow-1 container-p-y">
            <div class="row">
              <div class="form-container">
                <form [formGroup]="livraisonForm" (ngSubmit)="onSubmit()">
                  <div>
                    <label for="lieuDepart">Lieu de départ</label>
                    <input id="lieuDepart" formControlName="lieuDepart" #lieuDepartInput>
                    <ul *ngIf="departSuggestions.length">
                      <li *ngFor="let suggestion of departSuggestions" (click)="selectSuggestion(suggestion, 'lieuDepart')">
                        {{ suggestion.display_name }}
                      </li>
                    </ul>
                  </div>
                
                  <div>
                    <label for="destination">Destination</label>
                    <input id="destination" formControlName="destination" #destinationInput>
                    <ul *ngIf="destinationSuggestions.length">
                      <li *ngFor="let suggestion of destinationSuggestions" (click)="selectSuggestion(suggestion, 'destination')">
                        {{ suggestion.display_name }}
                      </li>
                    </ul>
                  </div>
                
                  <div>
                    <label for="vehicule">Véhicule</label>
                    <select id="vehicule" formControlName="vehicule">
                      <option *ngFor="let vehicule of vehicules" [value]="vehicule">{{ vehicule }}</option>
                    </select>
                  </div>
                
                  <div>
                    <label for="dateDepart">Date de départ</label>
                    <input id="dateDepart" type="date" formControlName="dateDepart">
                  </div>
                
                  <button type="submit" [disabled]="!livraisonForm.valid">Calculer l'itinéraire</button>
                </form>
              </div>

              <div #mapContainer id="map"></div>
            </div>
           
          </div>
          <!-- / Content -->

          <!-- Footer -->
          <footer class="content-footer footer bg-footer-theme">
            <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
              <div class="mb-2 mb-md-0">
                ©
                <script>
                  document.write(new Date().getFullYear());
                </script>
                , made with ❤️ by
                <a href="https://themeselection.com" target="_blank" class="footer-link fw-bolder">ThemeSelection</a>
              </div>
              <div>
                <a href="https://themeselection.com/license/" class="footer-link me-4" target="_blank">License</a>
                <a href="https://themeselection.com/" target="_blank" class="footer-link me-4">More Themes</a>

                <a
                  href="https://themeselection.com/demo/sneat-bootstrap-html-admin-template/documentation/"
                  target="_blank"
                  class="footer-link me-4"
                  >Documentation</a
                >

                <a
                  href="https://github.com/themeselection/sneat-html-admin-template-free/issues"
                  target="_blank"
                  class="footer-link me-4"
                  >Support</a
                >
              </div>
            </div>
          </footer>
          <!-- / Footer -->

          <div class="content-backdrop fade"></div>
        </div>
        <!-- Content wrapper -->
      </div>
      <!-- / Layout page -->
    </div>

    <!-- Overlay -->
    <div class="layout-overlay layout-menu-toggle"></div>
  </div>
  <!-- / Layout wrapper -->

  <div class="buy-now">
    <a
      href="https://themeselection.com/products/sneat-bootstrap-html-admin-template/"
      target="_blank"
      class="btn btn-danger btn-buy-now"
      >Contactez nous</a
    >
  </div>

</body>
</html>
