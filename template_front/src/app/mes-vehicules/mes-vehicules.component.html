<div class="layout-wrapper layout-content-navbar">
  <div class="layout-container">
    <app-expbar2></app-expbar2>
    <!-- / Menu -->

    <!-- Layout container -->
    <div class="layout-page">
      <!-- Navbar -->
      <app-expbar></app-expbar>
      <div class="content-wrapper">
        <!-- Content -->
        <div class="container">
          <h1>Gestion d'Équipe</h1>
          <p-steps [model]="steps" [activeIndex]="activeStep"></p-steps>

          <form [formGroup]="teamForm" (ngSubmit)="onSubmit()">
            <!-- Étape 1: Ajouter des Employés -->
            <div *ngIf="activeStep === 0" class="p-fluid">
              <h2>Ajouter des Employés</h2>
              <div class="p-field">
                <label for="employeeNames">Noms des Employés:</label>
                <p-chips id="employeeNames" formControlName="employeeNames" separator=","></p-chips>
              </div>
              <p-button type="button" label="Suivant" (click)="nextStep()"></p-button>
            </div>

            <!-- Étape 2: Ajouter des Clients -->
            <div *ngIf="activeStep === 1" class="p-fluid">
              <h2>Ajouter des Clients</h2>
              <div class="p-field">
                <label for="clientNames">Noms des Clients:</label>
                <p-chips id="clientNames" formControlName="clientNames" separator=","></p-chips>
              </div>
              <p-button type="button" label="Précédent" (click)="previousStep()"></p-button>
              <p-button type="button" label="Suivant" (click)="nextStep()"></p-button>
            </div>

            <!-- Étape 3: Ajouter des Projets -->
            <div *ngIf="activeStep === 2" class="p-fluid">
              <h2>Ajouter des Projets</h2>
              <div class="p-field">
                <label for="projectNames">Noms des Projets:</label>
                <p-chips id="projectNames" formControlName="projectNames" separator=","></p-chips>
              </div>
              <p-button type="button" label="Précédent" (click)="previousStep()"></p-button>
              <p-button type="submit" label="Ajouter"></p-button>
            </div>
          </form>
        </div>
        <!-- / Content -->

        <!-- Footer -->
        <footer class="content-footer footer bg-footer-theme">
          <div class="container-xxl d-flex flex-wrap justify-content-between py-2 flex-md-row flex-column">
            <div class="mb-2 mb-md-0">
              © <script>document.write(new Date().getFullYear());</script>, made with ❤️ by
              <a href="https://themeselection.com" target="_blank" class="footer-link fw-bolder">ThemeSelection</a>
            </div>
            <div>
              <a href="https://themeselection.com/license/" class="footer-link me-4" target="_blank">License</a>
              <a href="https://themeselection.com/" target="_blank" class="footer-link me-4">More Themes</a>
              <a href="https://themeselection.com/demo/sneat-bootstrap-html-admin-template/documentation/" target="_blank" class="footer-link me-4">Documentation</a>
              <a href="https://github.com/themeselection/sneat-html-admin-template-free/issues" target="_blank" class="footer-link me-4">Support</a>
            </div>
          </div>
        </footer>
        <!-- / Footer -->

        <div class="content-backdrop fade"></div>
      </div>
      <!-- Content wrapper -->
    </div>
    <!-- / Layout page -->
  </div>

  <!-- Overlay -->
  <div class="layout-overlay layout-menu-toggle"></div>
</div>
<!-- / Layout wrapper -->

  <a href="https://themeselection.com/products/sneat-bootstrap-html-admin-template/" target="_blank" class="btn btn-danger btn-buy-now">Contactez nous</a>
