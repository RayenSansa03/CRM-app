<div class="pipeline-container">
    <h2>Analyse du Pipeline de Vente</h2>
  
    <p-table [value]="opportunities" class="p-datatable">
      <ng-template pTemplate="header">
        <tr>
          <th>Nom</th>
          <th>Valeur (€)</th>
          <th>Étape</th>
          <th>Prochaine Action</th>
          <th>Actions</th>
        </tr>
      </ng-template>
  
      <ng-template pTemplate="body" let-opportunity>
        <tr>
          <td>{{ opportunity.name }}</td>
          <td>{{ opportunity.value }}</td>
          <td>{{ opportunity.stage }}</td>
          <td>{{ opportunity.nextAction }}</td>
          <td>
            <button pButton label="Modifier" icon="pi pi-pencil" (click)="editOpportunity(opportunity)"></button>
            <button pButton label="Supprimer" icon="pi pi-trash" class="p-button-danger" (click)="deleteOpportunity(opportunity)"></button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  
    <div class="add-opportunity">
      <button pButton label="Ajouter Opportunité" icon="pi pi-plus" (click)="openAddOpportunityDialog()"></button>
    </div>
  </div>
